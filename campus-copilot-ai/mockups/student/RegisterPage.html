<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - CampusCopilot</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;family=Hanken+Grotesk:wght@600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#006f66",
                        "on-tertiary-fixed-variant": "#5a00c6",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-fixed": "#25005a",
                        "secondary": "#006a61",
                        "outline": "#757682",
                        "surface-tint": "#4059aa",
                        "primary-container": "#1e3a8a",
                        "surface-container-highest": "#e0e3e5",
                        "tertiary-fixed-dim": "#d2bbff",
                        "surface-dim": "#d8dadc",
                        "on-background": "#191c1e",
                        "surface-container-low": "#f2f4f6",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#5200b5",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "secondary-container": "#86f2e4",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#264191",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#b6c4ff",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#00201d",
                        "primary-fixed": "#dce1ff",
                        "secondary-fixed": "#89f5e7",
                        "on-secondary-fixed-variant": "#005049",
                        "surface-container-high": "#e6e8ea",
                        "surface-bright": "#f7f9fb",
                        "on-primary-container": "#90a8ff",
                        "on-primary-fixed": "#00164e",
                        "inverse-primary": "#b6c4ff",
                        "primary": "#00236f",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e0e3e5",
                        "on-surface": "#191c1e",
                        "inverse-surface": "#2d3133",
                        "on-surface-variant": "#444651",
                        "tertiary": "#37007e",
                        "background": "#f7f9fb",
                        "surface-container": "#eceef0",
                        "tertiary-fixed": "#eaddff",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#bc9bff",
                        "outline-variant": "#c5c5d3",
                        "secondary-fixed-dim": "#6bd8cb",
                        "surface": "#f7f9fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "8px",
                        "sm": "16px",
                        "md": "24px",
                        "margin-mobile": "16px",
                        "xl": "64px",
                        "gutter": "16px",
                        "margin-desktop": "32px",
                        "base": "4px",
                        "lg": "40px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "display-lg": ["Hanken Grotesk"],
                        "title-md": ["Inter"],
                        "headline-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "label-caps": ["Geist"],
                        "mono-sm": ["Geist"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],

                }
            }
        }

</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile antialiased">
<!-- Main Container: Focused Registration Form -->
<main class="w-full max-w-[420px] bg-surface rounded-xl border border-surface-container-high shadow-lg p-md overflow-hidden relative">
<!-- Subtle AI Glassmorphic Glow Element in Background -->
<div class="absolute -top-20 -right-20 w-64 h-64 bg-tertiary/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- Header -->
<header class="text-center mb-lg relative z-10">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary tracking-tight">CampusCopilot</h1>
<h2 class="font-title-md text-title-md text-on-surface mt-sm">Create an Account</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">Provide your details to get started.</p>
</header>
<!-- Registration Form -->
<form action="#" class="flex flex-col gap-sm relative z-10" method="POST">
<!-- Full Name -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" style="font-size: 20px;">person</span>
<input class="w-full pl-10 pr-sm py-xs border border-outline-variant rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" style="font-size: 20px;">mail</span>
<input class="w-full pl-10 pr-sm py-xs border border-outline-variant rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="email" name="email" placeholder="student@university.edu" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" style="font-size: 20px;">lock</span>
<input class="w-full pl-10 pr-sm py-xs border border-outline-variant rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Department Dropdown -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="department">Department</label>
<select class="w-full px-sm py-xs border border-outline-variant rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface appearance-none focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23757682%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-[length:20px] bg-no-repeat bg-[position:right_12px_center] pr-10" id="department" name="department" required="">
<option disabled="" selected="" value="">Select Department</option>
<option value="cs">Computer Science</option>
<option value="ee">Electrical Engineering</option>
<option value="me">Mechanical Engineering</option>
<option value="ba">Business Administration</option>
</select>
</div>
<!-- Semester & Section Row -->
<div class="flex gap-sm w-full">
<div class="flex flex-col gap-base flex-1">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="semester">Semester</label>
<select class="w-full px-sm py-xs border border-outline-variant rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface appearance-none focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23757682%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-[length:20px] bg-no-repeat bg-[position:right_12px_center] pr-10" id="semester" name="semester" required="">
<option disabled="" selected="" value="">Select</option>
<option value="1">1st Semester</option>
<option value="2">2nd Semester</option>
<option value="3">3rd Semester</option>
<option value="4">4th Semester</option>
<option value="5">5th Semester</option>
<option value="6">6th Semester</option>
<option value="7">7th Semester</option>
<option value="8">8th Semester</option>
</select>
</div>
<div class="flex flex-col gap-base flex-1">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="section">Section</label>
<select class="w-full px-sm py-xs border border-outline-variant rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface appearance-none focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23757682%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-[length:20px] bg-no-repeat bg-[position:right_12px_center] pr-10" id="section" name="section" required="">
<option disabled="" selected="" value="">Select</option>
<option value="a">A</option>
<option value="b">B</option>
<option value="c">C</option>
<option value="d">D</option>
</select>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-sm py-sm bg-primary text-on-primary rounded-lg font-title-md text-title-md hover:bg-on-primary-fixed focus:outline-none focus:ring-4 focus:ring-primary/30 active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-xs" type="submit">
                Create Account
                <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-md text-center border-t border-surface-container-high pt-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-semibold hover:underline" href="#">Log in here</a>
</p>
</div>
</main>
</body></html>
