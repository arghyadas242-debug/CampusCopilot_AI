<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CampusCopilot - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Hanken+Grotesk:wght@100..900&amp;family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#006f66",
                        "on-tertiary-fixed-variant": "#5a00c6",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-fixed": "#25005a",
                        "secondary": "#006a61",
                        "outline": "#757682",
                        "surface-tint": "#4059aa",
                        "primary-container": "#1e3a8a",
                        "surface-container-highest": "#e0e3e5",
                        "tertiary-fixed-dim": "#d2bbff",
                        "surface-dim": "#d8dadc",
                        "on-background": "#191c1e",
                        "surface-container-low": "#f2f4f6",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#5200b5",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "secondary-container": "#86f2e4",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#264191",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#b6c4ff",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#00201d",
                        "primary-fixed": "#dce1ff",
                        "secondary-fixed": "#89f5e7",
                        "on-secondary-fixed-variant": "#005049",
                        "surface-container-high": "#e6e8ea",
                        "surface-bright": "#f7f9fb",
                        "on-primary-container": "#90a8ff",
                        "on-primary-fixed": "#00164e",
                        "inverse-primary": "#b6c4ff",
                        "primary": "#00236f",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e0e3e5",
                        "on-surface": "#191c1e",
                        "inverse-surface": "#2d3133",
                        "on-surface-variant": "#444651",
                        "tertiary": "#37007e",
                        "background": "#f7f9fb",
                        "surface-container": "#eceef0",
                        "tertiary-fixed": "#eaddff",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#bc9bff",
                        "outline-variant": "#c5c5d3",
                        "secondary-fixed-dim": "#6bd8cb",
                        "surface": "#f7f9fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "8px",
                        "sm": "16px",
                        "md": "24px",
                        "margin-mobile": "16px",
                        "xl": "64px",
                        "gutter": "16px",
                        "margin-desktop": "32px",
                        "base": "4px",
                        "lg": "40px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "display-lg": ["Hanken Grotesk"],
                        "title-md": ["Inter"],
                        "headline-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "label-caps": ["Geist"],
                        "mono-sm": ["Geist"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "mono-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Login Container -->
<main class="w-full max-w-md bg-surface-container-lowest border border-surface-container-high rounded-xl p-md md:p-lg flex flex-col gap-lg shadow-sm relative overflow-hidden">
<!-- Header -->
<header class="flex flex-col items-center text-center gap-sm z-10">
<div class="h-12 w-12 bg-primary-container rounded-lg flex items-center justify-center text-on-primary-container mb-2">
<span class="material-symbols-outlined" data-icon="school" style="font-size: 28px; font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-tight">CampusCopilot</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to access your academic dashboard.</p>
</header>
<!-- Form Section -->
<section class="flex flex-col gap-md z-10 w-full">
<form action="#" class="flex flex-col gap-md" method="POST">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface uppercase tracking-wider" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-outline" data-icon="mail" style="font-size: 20px;">mail</span>
<input class="w-full bg-surface-container-low border border-surface-container-high rounded-lg pl-10 pr-sm py-3 font-body-sm text-body-sm text-on-surface placeholder-outline focus:border-primary focus:ring-2 focus:ring-primary-container transition-all" id="email" name="email" placeholder="student@campus.edu" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface uppercase tracking-wider" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-outline" data-icon="lock" style="font-size: 20px;">lock</span>
<input class="w-full bg-surface-container-low border border-surface-container-high rounded-lg pl-10 pr-sm py-3 font-body-sm text-body-sm text-on-surface placeholder-outline focus:border-primary focus:ring-2 focus:ring-primary-container transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-title-md text-title-md py-3 rounded-lg hover:bg-primary-container hover:text-on-primary-container transition-colors mt-2 flex justify-center items-center gap-sm" type="submit">
                    Login
                    <span class="material-symbols-outlined" data-icon="arrow_forward" style="font-size: 20px;">arrow_forward</span>
</button>
</form>
<!-- Secondary Actions -->
<div class="text-center mt-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? <a class="text-primary hover:underline font-title-md text-title-md" href="#">Create account</a>
</p>
</div>
</section>
<!-- Footer / Trust Badges -->
<footer class="mt-4 pt-md border-t border-surface-container-high flex flex-col items-center justify-center gap-xs z-10 w-full text-center">
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="shield" style="font-size: 16px;">shield</span>
<span class="font-mono-sm text-mono-sm text-outline">Secured by Firebase Authentication</span>
</div>
</footer>
<!-- Decorative background elements (Glassmorphism hint) -->
<div class="absolute -top-24 -right-24 w-64 h-64 bg-primary-container rounded-full opacity-[0.03] blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-24 -left-24 w-64 h-64 bg-tertiary-container rounded-full opacity-[0.03] blur-3xl pointer-events-none"></div>
</main>
</body></html>
